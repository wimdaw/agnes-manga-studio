name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号（例如 v1.6.0，需与 package.json 一致）'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            asset: AgnesStudio-windows-x64.exe
          - os: macos-15-intel
            label: macos-x64
            asset: AgnesStudio-macos-x64.zip
          # arm64 runner 排队不可控，改为在 Intel 镜像上下载官方 arm64 Node
          # 作为宿主运行时交叉产出；blob 与签名都跨架构可用
          - os: macos-15-intel
            label: macos-arm64
            asset: AgnesStudio-macos-arm64.zip
            node_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 应用本身零运行时依赖；postject 只在打包期用
      - name: Install build dependency
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Fetch arm64 Node runtime
        if: matrix.node_arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          V="$(node -v)"
          URL="https://nodejs.org/dist/${V}/node-${V}-darwin-arm64.tar.gz"
          echo "downloading ${URL}"
          curl -fsSL "$URL" -o "${RUNNER_TEMP}/node-arm64.tar.gz"
          mkdir -p .node-arm64
          tar -xzf "${RUNNER_TEMP}/node-arm64.tar.gz" -C .node-arm64 --strip-components=1
          echo "NODE_BIN=$PWD/.node-arm64/bin/node" >> "$GITHUB_ENV"

      - name: Build single-file binary
        if: matrix.node_arch != 'arm64'
        run: node tools/build-exe.mjs

      - name: Build single-file binary (arm64 host runtime)
        if: matrix.node_arch == 'arm64'
        shell: bash
        run: node tools/build-exe.mjs --node-bin "$NODE_BIN"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "dist/Agnes漫剧工坊.exe" "${{ matrix.asset }}"
          Get-Item "${{ matrix.asset }}" | Select-Object Name, Length

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp "dist/Agnes漫剧工坊" pkg/AgnesStudio
          chmod +x pkg/AgnesStudio
          cp .github/macos-readme.txt pkg/使用说明.txt
          ditto -c -k --sequesterRsrc --keepParent pkg "${{ matrix.asset }}"
          ls -lh "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "publishing ${TAG}"
          ls -lh artifacts
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # 重跑同一版本时覆盖资产，避免 "release already exists" 让流水线假失败
            gh release upload "${TAG}" artifacts/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" --notes-file .github/release-notes.md --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Agnes 漫剧工坊 ${TAG}" \
              --notes-file .github/release-notes.md
          fi
